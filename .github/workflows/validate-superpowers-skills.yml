name: Superpowers Skill Asset Validation

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/validate-superpowers-skills.yml"
  push:
    branches: ["main"]
    paths:
      - ".agents/skills/**"
      - ".github/workflows/validate-superpowers-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate vendored skill assets and links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate local skill references
        run: python .agents/skills/validate_skill_assets.py
      - name: Validate brainstorm server shell syntax and argument handling
        run: |
          bash -n .agents/skills/brainstorming/scripts/start-server.sh
          bash -n .agents/skills/brainstorming/scripts/start-server.test.sh
          bash .agents/skills/brainstorming/scripts/start-server.test.sh
