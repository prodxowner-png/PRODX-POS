name: Production Runtime Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: production-runtime-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production frontend and API health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API liveness
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            --max-time 15 \
            --output /tmp/api-healthz.json \
            --write-out "HTTP %{http_code}\n" \
            https://prodx-pos.vercel.app/api/v1/healthz
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/api-healthz.json

      - name: Check API readiness
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            --max-time 15 \
            --output /tmp/api-readyz.json \
            --write-out "HTTP %{http_code}\n" \
            https://prodx-pos.vercel.app/api/v1/readyz
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' /tmp/api-readyz.json

      - name: Check frontend availability
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            --max-time 15 \
            --output /tmp/frontend.html \
            --write-out "HTTP %{http_code}\n" \
            https://prodx-pos.vercel.app/
          grep -Fq "PRODX POS" /tmp/frontend.html

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-runtime-smoke
          path: |
            /tmp/api-healthz.json
            /tmp/api-readyz.json
            /tmp/frontend.html
          retention-days: 7
