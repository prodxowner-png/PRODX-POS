name: Gemini Model Capability Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-model-capability-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Gemini Developer API capability probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Probe Gemini Developer API model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/gemini_model_router.py
