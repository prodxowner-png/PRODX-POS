name: Transaction Core Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: transaction-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transaction-core:
    name: PostgreSQL transaction integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Backend type check
        run: bun run server:check
      - name: Apply clean PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify transaction schema invariants
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0007_m2_transaction_core';
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0008_m2_transaction_store_membership';
          SELECT 1 FROM information_schema.columns WHERE table_name='prodx_products' AND column_name='price_amount' AND data_type='numeric' AND numeric_precision=12 AND numeric_scale=2;
          SELECT 1 FROM information_schema.columns WHERE table_name='prodx_orders' AND column_name='grand_total_amount' AND data_type='numeric' AND numeric_precision=12 AND numeric_scale=2;
          SELECT 1 FROM information_schema.columns WHERE table_name='prodx_payments' AND column_name='amount' AND data_type='numeric' AND numeric_precision=12 AND numeric_scale=2;
          SELECT 1 FROM pg_constraint WHERE conname='prodx_orders_store_idempotency_unique';
          SELECT 1 FROM pg_constraint WHERE conname='prodx_orders_cashier_store_membership_fk';
          SELECT 1 FROM pg_constraint WHERE conname='prodx_inventory_user_store_membership_fk';
          SQL
      - name: PostgreSQL checkout and refund integration tests
        run: bun run server:test:integration

      - name: Refund HTTP boundary and PostgreSQL invariant tests
        run: bun run server:test:refund
      - name: Re-apply migrations to verify idempotency
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
