name: PRODX POS — Verify Delivery Gates

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prodx-pos-delivery-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Edge, PostgreSQL, Chaos & Reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: prodx-pos-edge-sync

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prodx_pos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prodx_pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Disposable CI database only. Never reuse these credentials in production.
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prodx_pos_ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/prodx_pos_ci
      POS_CI_MODE: "true"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Pin npm resolver for reproducible CI installs
        run: |
          npm install --global npm@10.9.4
          npm --version

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare verification logs
        run: mkdir -p artifacts/logs

      - name: Generate per-run CI credentials
        run: |
          set -euo pipefail
          worker_role_password="$(openssl rand -hex 32)"
          catalog_writer_role_password="$(openssl rand -hex 32)"
          device_admin_role_password="$(openssl rand -hex 32)"
          inventory_admin_role_password="$(openssl rand -hex 32)"
          rls_auditor_role_password="$(openssl rand -hex 32)"
          reconciliation_admin_role_password="$(openssl rand -hex 32)"
          catalog_signing_key="$(openssl rand -hex 32)"
          runtime_database_url="postgres://prodx_pos_worker:${worker_role_password}@localhost:5432/prodx_pos_ci"
          rls_audit_database_url="postgres://prodx_rls_auditor:${rls_auditor_role_password}@localhost:5432/prodx_pos_ci"
          reconciliation_database_url="postgres://prodx_reconciliation_admin:${reconciliation_admin_role_password}@localhost:5432/prodx_pos_ci"
          {
            printf 'CI_WORKER_ROLE_PASSWORD=%s\n' "$worker_role_password"
            printf 'CI_CATALOG_WRITER_ROLE_PASSWORD=%s\n' "$catalog_writer_role_password"
            printf 'CI_DEVICE_ADMIN_ROLE_PASSWORD=%s\n' "$device_admin_role_password"
            printf 'CI_INVENTORY_ADMIN_ROLE_PASSWORD=%s\n' "$inventory_admin_role_password"
            printf 'CI_RLS_AUDITOR_ROLE_PASSWORD=%s\n' "$rls_auditor_role_password"
            printf 'CI_RECONCILIATION_ADMIN_ROLE_PASSWORD=%s\n' "$reconciliation_admin_role_password"
            printf 'CATALOG_SIGNING_KEY=%s\n' "$catalog_signing_key"
            printf 'RUNTIME_DATABASE_URL=%s\n' "$runtime_database_url"
            printf 'RLS_AUDIT_DATABASE_URL=%s\n' "$rls_audit_database_url"
            printf 'RECONCILIATION_DATABASE_URL=%s\n' "$reconciliation_database_url"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$worker_role_password"
          echo "::add-mask::$catalog_writer_role_password"
          echo "::add-mask::$device_admin_role_password"
          echo "::add-mask::$inventory_admin_role_password"
          echo "::add-mask::$rls_auditor_role_password"
          echo "::add-mask::$reconciliation_admin_role_password"
          echo "::add-mask::$catalog_signing_key"
          echo "::add-mask::$runtime_database_url"
          echo "::add-mask::$rls_audit_database_url"
          echo "::add-mask::$reconciliation_database_url"

      # ─────────────────────────────────────────────────────────────
      # Gate 3 — Build & Edge Unit Verification (real workerd runtime)
      # ─────────────────────────────────────────────────────────────
      - name: Gate 3.1 — Install dependencies
        id: install
        run: npm ci --no-audit --no-fund --legacy-peer-deps --verbose 2>&1 | tee artifacts/logs/npm-ci.log

      - name: Gate 3.1b — Audit locked Edge dependencies
        id: dependency_audit
        run: npm audit --audit-level=moderate 2>&1 | tee artifacts/logs/npm-audit.log

      - name: Gate 3.1a — Validate manual Cloudflare Staging automation syntax
        run: |
          bash -n scripts/provision-staging.sh
          ruby -e 'require "yaml"; YAML.parse_file("../.github/workflows/verify-gate6-staging.yml"); YAML.parse_file("../.github/workflows/gate6-staging-bootstrap.yml"); puts "Gate 6 workflows YAML syntax: PASS"'
          echo "Staging provisioning shell syntax: PASS"


      - name: Gate 3.2 — Generate Wrangler bindings
        id: wrangler_types
        run: npx wrangler types 2>&1 | tee artifacts/logs/wrangler-types.log

      - name: Gate 3.3 — Full TypeScript typecheck
        id: typecheck
        run: npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log

      - name: Gate 3.4 — Cloudflare workerd Edge tests
        id: edge_tests
        run: npm run test:edge 2>&1 | tee artifacts/logs/edge-tests.log

      # ─────────────────────────────────────────────────────────────
      # Gate 4 — PostgreSQL 16 CTE, RLS, Signed Price & Ledger Tests
      # ─────────────────────────────────────────────────────────────
      - name: Gate 4.1 — Apply immutable PostgreSQL base migration
        id: migration
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_pos_ledger.sql 2>&1 | tee artifacts/logs/migration.log

      - name: Gate 4.1.1 — Reject unmapped legacy Store inventory without partial DDL
        id: inventory_migration_preflight
        run: npm run migration:preflight 2>&1 | tee artifacts/logs/store-migration-preflight.log

      - name: Gate 4.1.2 — Apply Store-scoped inventory migration
        id: inventory_migration
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_store_scoped_inventory.sql 2>&1 | tee artifacts/logs/migration-002-store-scoped.log

      - name: Gate 4.1.3 — Apply forward failed-sequence recovery migrations twice
        id: failed_sequence_recovery_migration
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/003_failed_sequence_recovery.sql 2>&1 | tee artifacts/logs/failed-sequence-recovery-migration.log
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/003_failed_sequence_recovery.sql 2>&1 | tee artifacts/logs/failed-sequence-recovery-migration-rerun.log
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/004_terminal_retry_attempt_audit.sql 2>&1 | tee artifacts/logs/terminal-retry-attempt-audit-migration.log
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/004_terminal_retry_attempt_audit.sql 2>&1 | tee artifacts/logs/terminal-retry-attempt-audit-migration-rerun.log

      - name: Gate 4.2 — Create isolated CI database roles
        id: create_roles
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v worker_role_password="$CI_WORKER_ROLE_PASSWORD" \
            -v catalog_writer_role_password="$CI_CATALOG_WRITER_ROLE_PASSWORD" \
            -v device_admin_role_password="$CI_DEVICE_ADMIN_ROLE_PASSWORD" \
            -v inventory_admin_role_password="$CI_INVENTORY_ADMIN_ROLE_PASSWORD" \
            -v rls_auditor_role_password="$CI_RLS_AUDITOR_ROLE_PASSWORD" \
            -v reconciliation_admin_role_password="$CI_RECONCILIATION_ADMIN_ROLE_PASSWORD" \
            -f scripts/create-ci-roles.sql 2>&1 | tee artifacts/logs/create-ci-roles.log

      - name: Gate 4.3 — Grant least-privilege runtime permissions
        id: grants
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/grant-runtime-role.sql 2>&1 | tee artifacts/logs/grant-runtime-role.log

      - name: Gate 4.3b — Verify least-privilege runtime role permissions across all 15 tables
        id: verify_privileges
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-runtime-role-privileges.sql 2>&1 | tee artifacts/logs/verify-runtime-role-privileges.log

      - name: Gate 4.4 — Verify RLS with NOBYPASSRLS auditor
        id: rls
        run: psql "$RLS_AUDIT_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/rls-smoke.sql 2>&1 | tee artifacts/logs/rls-smoke.log

      - name: Gate 4.5 — PostgreSQL 16 signed offline price & CTE integration
        id: postgres_integration
        run: npm run integration:postgres 2>&1 | tee artifacts/logs/postgres-integration.log

      - name: Gate 4.6 — Store-scoped inventory and concurrent oversell integration
        id: inventory_integration
        run: npm run integration:inventory 2>&1 | tee artifacts/logs/inventory-integration.log

      # No opening-stock seed is needed here: the CI chaos harness creates a
      # disposable tenant/product and records its opening quantity through the
      # immutable inventory_ledger path before testing POS sale deltas.

      # ─────────────────────────────────────────────────────────────
      # Gate 5 — Concurrent CTE Load, Duplicate Storm & Reconciliation
      # ─────────────────────────────────────────────────────────────
      - name: Gate 5.1 — 300-terminal PostgreSQL CI chaos load
        id: chaos
        run: npm run chaos 2>&1 | tee artifacts/logs/chaos-load.log

      - name: Gate 5.2 — Prepare empty DO export (CI has no deployed DO namespace)
        run: cp scripts/empty-do-outbox-export.csv do-outbox-export.csv

      - name: Gate 5.3 — Strict SQL reconciliation (non-zero anomalies fail CI)
        id: reconcile
        run: psql "$RECONCILIATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/reconcile.sql 2>&1 | tee artifacts/logs/reconcile.log

      # ─────────────────────────────────────────────────────────────
      # Delivery report and evidence
      # ─────────────────────────────────────────────────────────────
      - name: Write 6-Stage Delivery Gate Summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          TYPES_OUTCOME: ${{ steps.wrangler_types.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          EDGE_OUTCOME: ${{ steps.edge_tests.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          INVENTORY_PREFLIGHT_OUTCOME: ${{ steps.inventory_migration_preflight.outcome }}
          INVENTORY_MIGRATION_OUTCOME: ${{ steps.inventory_migration.outcome }}
          RECOVERY_MIGRATION_OUTCOME: ${{ steps.failed_sequence_recovery_migration.outcome }}
          ROLES_OUTCOME: ${{ steps.create_roles.outcome }}
          GRANTS_OUTCOME: ${{ steps.grants.outcome }}
          PRIVILEGES_OUTCOME: ${{ steps.verify_privileges.outcome }}
          RLS_OUTCOME: ${{ steps.rls.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.postgres_integration.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory_integration.outcome }}
          CHAOS_OUTCOME: ${{ steps.chaos.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          result() { if [ "$1" = "success" ]; then echo "PASS"; elif [ "$1" = "skipped" ]; then echo "NOT RUN"; else echo "FAIL / $1"; fi; }
          {
            echo "## PRODX POS — 6-Stage Delivery Gates"
            echo ""
            echo "| Stage | Evidence | Result |"
            echo "|---|---|---|"
            echo "| 1. Architecture Approved | Reviewed architecture baseline; not re-evaluated by this workflow | BASELINE |"
            echo "| 2. Implementation Complete | Versioned source package checked out | BASELINE |"
            echo "| 3. Build Verified | npm ci: $(result "$INSTALL_OUTCOME"); dependency audit: $(result "$AUDIT_OUTCOME"); Wrangler types: $(result "$TYPES_OUTCOME"); TypeScript: $(result "$TYPECHECK_OUTCOME"); workerd: $(result "$EDGE_OUTCOME") | $( [ "$INSTALL_OUTCOME" = success ] && [ "$AUDIT_OUTCOME" = success ] && [ "$TYPES_OUTCOME" = success ] && [ "$TYPECHECK_OUTCOME" = success ] && [ "$EDGE_OUTCOME" = success ] && echo PASS || echo FAIL ) |"
            echo "| 4. Integration Verified | Base migration: $(result "$MIGRATION_OUTCOME"); legacy Store preflight: $(result "$INVENTORY_PREFLIGHT_OUTCOME"); Store migration: $(result "$INVENTORY_MIGRATION_OUTCOME"); recovery migrations: $(result "$RECOVERY_MIGRATION_OUTCOME"); roles/grants/privileges: $(result "$ROLES_OUTCOME")/$(result "$GRANTS_OUTCOME")/$(result "$PRIVILEGES_OUTCOME"); RLS: $(result "$RLS_OUTCOME"); PostgreSQL CTE: $(result "$INTEGRATION_OUTCOME"); Store inventory: $(result "$INVENTORY_OUTCOME") | $( [ "$MIGRATION_OUTCOME" = success ] && [ "$INVENTORY_PREFLIGHT_OUTCOME" = success ] && [ "$INVENTORY_MIGRATION_OUTCOME" = success ] && [ "$RECOVERY_MIGRATION_OUTCOME" = success ] && [ "$ROLES_OUTCOME" = success ] && [ "$GRANTS_OUTCOME" = success ] && [ "$PRIVILEGES_OUTCOME" = success ] && [ "$RLS_OUTCOME" = success ] && [ "$INTEGRATION_OUTCOME" = success ] && [ "$INVENTORY_OUTCOME" = success ] && echo PASS || echo FAIL ) |"
            echo "| 5. Load & Recovery Verified | 300 terminal CI-scale PostgreSQL load: $(result "$CHAOS_OUTCOME"); SQL reconciliation: $(result "$RECONCILE_OUTCOME") | $( [ "$CHAOS_OUTCOME" = success ] && [ "$RECONCILE_OUTCOME" = success ] && echo PASS || echo FAIL ) |"
            echo "| 6. Production Ready | Requires deployed Cloudflare staging, real DO/Queue crash recovery, mTLS/WAF validation and production-like load evidence | HOLD |"
            echo ""
            echo "> CI uses a disposable PostgreSQL 16 service and dummy signing key. A successful run does not by itself certify Cloudflare staging or Production Ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prodx-pos-delivery-gates-${{ github.run_number }}
          path: prodx-pos-edge-sync/artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
