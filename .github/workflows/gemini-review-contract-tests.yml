name: Gemini Review Contract Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/gemini_pr_review.py"
      - "scripts/test_gemini_pr_review.py"
      - ".github/workflows/gemini-review-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: gemini-review-contract-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Gemini review Python contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request code (unprivileged)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Python runtime
        run: python3 --version

      - name: Run Gemini review contract tests
        run: python3 -m unittest discover -s scripts -p 'test_gemini_pr_review.py' -v
