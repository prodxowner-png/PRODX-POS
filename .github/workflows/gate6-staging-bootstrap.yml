name: PRODX POS — Gate 6 Cloudflare Staging Verification

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact PR branch to verify"
        required: true
        type: string
        default: "fix/edge-sync-p1-integrity-remediation"
      expected_head_sha:
        description: "Expected 40-character commit SHA for the target branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prodx-pos-gate6-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Provision, Deploy & Verify Cloudflare Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The workflow definition itself must come from protected main.
    # The Edge Sync PR is checked out separately by its exact SHA.
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: staging
    defaults:
      run:
        shell: bash
        working-directory: prodx-pos-edge-sync
    steps:
      - name: Enforce protected default-branch dispatch
        working-directory: .
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/main" && "$DISPATCH_REF_PROTECTED" == "true" ]] || {
            echo "::error::Gate 6 must be dispatched from protected main; refusing to expose Staging credentials."
            exit 1
          }

      - name: Validate requested target
        working-directory: .
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" == "fix/edge-sync-p1-integrity-remediation" ]] || {
            echo "::error::Only the reviewed Edge Sync integrity-remediation branch is permitted."
            exit 1
          }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_head_sha must be a full 40-character lowercase SHA."
            exit 1
          }

      - name: Checkout exact reviewed PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Verify exact checked-out commit
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "::error::Target branch moved: expected $EXPECTED_HEAD_SHA, got $actual."
            exit 1
          }
          echo "Verified exact target commit: $actual"

      - name: Verify owner-signed immutable target commit before exposing Staging credentials
        working-directory: .
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA")"
          jq -e '
            .commit.verification.verified == true and
            .commit.verification.reason == "valid" and
            .author.login == "prodxowner-png" and
            .committer.login == "prodxowner-png"
          ' <<<"$commit_json" >/dev/null || {
            echo "::error::Target commit must have a valid GitHub-verified signature from the repository owner."
            exit 1
          }
          echo "Verified owner-signed target commit: $EXPECTED_HEAD_SHA"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prodx-pos-edge-sync/package-lock.json

      # This runs against the checked-out PR source, before any Staging secret is exposed.
      - name: Verify Edge Sync, Vercel proxy, migrations & export contract
        working-directory: .
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const exportSource = fs.readFileSync('prodx-pos-edge-sync/scripts/export-do-health.ts', 'utf8');
          for (const name of ['POS_SYNC_URL', 'POS_PROXY_TOKEN', 'VERCEL_AUTOMATION_BYPASS_SECRET', 'POS_TERMINAL_IDS']) {
            assert.ok(exportSource.includes(`process.env.${name}`), `DO export script no longer consumes ${name}`);
          }
          const proxy = fs.readFileSync('server/staging-edge-proxy.ts', 'utf8');
          for (const name of ['POS_STAGING_PROXY_TOKEN', 'POS_STAGING_WORKER_ORIGIN', 'POS_STAGING_ACCESS_TOKEN',
            'POS_STAGING_OPS_ACCESS_TOKEN', 'POS_STAGING_MTLS_CERT_PEM', 'POS_STAGING_MTLS_KEY_PEM']) {
            assert.ok(proxy.includes(name), `Vercel Staging proxy no longer requires ${name}`);
          }
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          assert.ok(vercel.rewrites.some((rule) => rule.source === '/__staging/edge/:path*' &&
            rule.destination === '/api/staging-edge?path=:path*'), 'Dedicated Vercel Staging proxy rewrite is missing');
          assert.ok(fs.existsSync('api/staging-edge.ts'), 'Vercel Staging proxy handler is missing');
          const wrangler = JSON.parse(fs.readFileSync('prodx-pos-edge-sync/wrangler.jsonc', 'utf8'));
          assert.equal(wrangler.env?.staging?.name, 'prodx-pos-edge-sync-staging', 'Staging Worker name changed');
          assert.ok(wrangler.env?.staging?.queues?.producers?.some((item) => item.queue === 'prodx-pos-ingest-staging'),
            'Staging ingest queue binding is missing');
          assert.ok(wrangler.env?.staging?.queues?.consumers?.some((item) => item.queue === 'prodx-pos-ingest-staging'),
            'Staging ingest queue consumer is missing');
          for (const file of [
            'prodx-pos-edge-sync/migrations/001_pos_ledger.sql',
            'prodx-pos-edge-sync/migrations/002_inventory_nonnegative.sql',
            'prodx-pos-edge-sync/migrations/003_failed_sequence_recovery.sql',
            'prodx-pos-edge-sync/migrations/004_terminal_retry_attempt_audit.sql',
            'prodx-pos-edge-sync/scripts/grant-runtime-role.sql',
            'prodx-pos-edge-sync/scripts/rls-smoke.sql',
            'prodx-pos-edge-sync/scripts/reconcile.sql'
          ]) assert.ok(fs.existsSync(file), `Required Gate 6 source file is missing: ${file}`);
          console.log('PASS: Edge Sync, Vercel proxy, migrations, grants, RLS and DO export contracts are present.');
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Preflight — require isolated Staging credentials and fixtures
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODX_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODX_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.PRODX_STAGING_DATABASE_URL }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.PRODX_STAGING_MIGRATION_DATABASE_URL }}
          STAGING_RLS_AUDIT_DATABASE_URL: ${{ secrets.PRODX_STAGING_RLS_AUDIT_DATABASE_URL }}
          STAGING_RECONCILIATION_DATABASE_URL: ${{ secrets.PRODX_STAGING_RECONCILIATION_DATABASE_URL }}
          POS_STAGING_ACCESS_AUD: ${{ secrets.PRODX_STAGING_ACCESS_AUD }}
          POS_STAGING_SYNC_URL: ${{ secrets.PRODX_STAGING_SYNC_URL }}
          POS_STAGING_PROXY_TOKEN: ${{ secrets.PRODX_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.PRODX_STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_STAGING_E2E_PAYLOAD_B64: ${{ secrets.PRODX_STAGING_E2E_PAYLOAD_B64 }}
          POS_STAGING_TERMINAL_IDS_JSON: ${{ secrets.PRODX_STAGING_TERMINAL_IDS_JSON }}
          CATALOG_SIGNING_KEY: ${{ secrets.PRODX_STAGING_CATALOG_SIGNING_KEY }}
          EXPECTED_STAGING_DATABASE_HOST: ${{ vars.PRODX_STAGING_DATABASE_HOST }}
          EXPECTED_STAGING_DATABASE_NAME: ${{ vars.PRODX_STAGING_DATABASE_NAME }}
          EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST: ${{ vars.PRODX_STAGING_RECONCILIATION_DATABASE_HOST }}
          EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME: ${{ vars.PRODX_STAGING_RECONCILIATION_DATABASE_NAME }}
          EXPECTED_POS_STAGING_SYNC_HOST: ${{ vars.PRODX_STAGING_SYNC_HOST }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL
            STAGING_MIGRATION_DATABASE_URL STAGING_RLS_AUDIT_DATABASE_URL
            STAGING_RECONCILIATION_DATABASE_URL POS_STAGING_ACCESS_AUD POS_STAGING_SYNC_URL
            POS_STAGING_PROXY_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET POS_STAGING_E2E_PAYLOAD_B64
            POS_STAGING_TERMINAL_IDS_JSON CATALOG_SIGNING_KEY EXPECTED_STAGING_DATABASE_HOST
            EXPECTED_STAGING_DATABASE_NAME EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST
            EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME EXPECTED_POS_STAGING_SYNC_HOST)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment 'staging' secret/variable: $name"
              exit 1
            fi
          done
          node -e 'const k=process.env.CATALOG_SIGNING_KEY; if(typeof k!=="string" || k.length<32 || Buffer.byteLength(k,"utf8")<32) { console.error("CATALOG_SIGNING_KEY must contain at least 32 UTF-8 bytes before provisioning"); process.exit(1); }'
          node -e 'const t=process.env.POS_STAGING_PROXY_TOKEN; if(typeof t!=="string" || Buffer.byteLength(t,"utf8")<32) { console.error("POS_STAGING_PROXY_TOKEN must contain at least 32 UTF-8 bytes"); process.exit(1); }'
          node <<'NODE'
          const assert = require('node:assert/strict');
          function databaseUrl(raw, expectedHost, expectedDatabase, expectedUser, label) {
            const url = new URL(raw);
            assert.ok(['postgres:', 'postgresql:'].includes(url.protocol), `${label} must use PostgreSQL`);
            assert.equal(url.hostname.toLowerCase(), expectedHost.toLowerCase(), `${label} host is not the approved Staging host`);
            assert.equal(decodeURIComponent(url.pathname.slice(1)), expectedDatabase, `${label} database is not the approved Staging database`);
            assert.ok(url.password.length > 0, `${label} must use an explicit database credential`);
            if (expectedUser) assert.equal(decodeURIComponent(url.username), expectedUser, `${label} must use ${expectedUser}`);
            return url;
          }
          const sync = new URL(process.env.POS_STAGING_SYNC_URL);
          assert.equal(sync.protocol, 'https:', 'Staging sync endpoint must use HTTPS');
          assert.equal(sync.username, '', 'Staging sync URL must not embed credentials');
          assert.equal(sync.password, '', 'Staging sync URL must not embed credentials');
          assert.equal(sync.search, '', 'Staging sync URL must not contain query parameters');
          assert.equal(sync.hash, '', 'Staging sync URL must not contain a fragment');
          assert.ok(sync.hostname.toLowerCase().endsWith('.vercel.app'), 'Gate 6 must use a Vercel Preview hostname');
          assert.notEqual(sync.hostname.toLowerCase(), 'prodx-pos.vercel.app', 'Production alias is forbidden for Gate 6');
          assert.equal(sync.hostname.toLowerCase(), process.env.EXPECTED_POS_STAGING_SYNC_HOST.toLowerCase(),
            'Staging sync hostname is not the approved Preview hostname');
          assert.equal(sync.pathname.replace(/\/$/, ''), '/__staging/edge', 'Staging sync URL must target the dedicated Vercel proxy');
          assert.match(process.env.POS_STAGING_ACCESS_AUD, /^[a-f0-9]{64}$/i, 'Staging Access AUD must be a 64-character hex audience');
          assert.match(process.env.CLOUDFLARE_ACCOUNT_ID, /^[a-f0-9]{32}$/i, 'Cloudflare account ID must be a 32-character hex ID');
          databaseUrl(process.env.STAGING_DATABASE_URL, process.env.EXPECTED_STAGING_DATABASE_HOST,
            process.env.EXPECTED_STAGING_DATABASE_NAME, 'prodx_pos_worker', 'STAGING_DATABASE_URL');
          const migration = databaseUrl(process.env.STAGING_MIGRATION_DATABASE_URL,
            process.env.EXPECTED_STAGING_DATABASE_HOST, process.env.EXPECTED_STAGING_DATABASE_NAME, null,
            'STAGING_MIGRATION_DATABASE_URL');
          assert.ok(!['prodx_pos_worker','prodx_rls_auditor','prodx_reconciliation_admin'].includes(decodeURIComponent(migration.username)),
            'Migration URL must use a separate DDL-capable Staging migration role');
          databaseUrl(process.env.STAGING_RLS_AUDIT_DATABASE_URL, process.env.EXPECTED_STAGING_DATABASE_HOST,
            process.env.EXPECTED_STAGING_DATABASE_NAME, 'prodx_rls_auditor', 'STAGING_RLS_AUDIT_DATABASE_URL');
          databaseUrl(process.env.STAGING_RECONCILIATION_DATABASE_URL,
            process.env.EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST,
            process.env.EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME,
            'prodx_reconciliation_admin', 'STAGING_RECONCILIATION_DATABASE_URL');
          const fixture = JSON.parse(Buffer.from(process.env.POS_STAGING_E2E_PAYLOAD_B64, 'base64').toString('utf8'));
          assert.ok(fixture && Array.isArray(fixture.sales) && fixture.sales.length >= 10 && fixture.sales.length <= 50,
            'E2E fixture must contain 10–50 sales');
          const keys = fixture.sales.map((sale) => sale?.idempotency_key);
          assert.ok(keys.every((key) => typeof key === 'string' && key.length >= 16 && key.length <= 200),
            'Every E2E sale must have a valid idempotency key');
          assert.equal(new Set(keys).size, keys.length, 'E2E fixture idempotency keys must be unique');
          const terminalIds = JSON.parse(process.env.POS_STAGING_TERMINAL_IDS_JSON);
          assert.ok(Array.isArray(terminalIds) && terminalIds.length > 0 && terminalIds.every((id) =>
            typeof id === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)),
            'Terminal IDs must be a non-empty array of UUIDs');
          console.log(`PASS: Staging allowlists and fixtures validated (${fixture.sales.length} sales, ${terminalIds.length} terminals).`);
          NODE
          mkdir -p prodx-pos-edge-sync/artifacts/logs

      - name: Preflight — verify Staging database roles before provisioning
        working-directory: .
        env:
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.PRODX_STAGING_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $rolepreflight$
          DECLARE missing_roles text[]; unsafe_roles text[];
          BEGIN
            SELECT array_agg(required.rolename)
              INTO missing_roles
              FROM unnest(ARRAY[
                'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
                'prodx_inventory_admin','prodx_rls_auditor','prodx_reconciliation_admin'
              ]) AS required(rolename)
             WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=required.rolename);
            IF missing_roles IS NOT NULL THEN
              RAISE EXCEPTION 'STAGING_ROLE_BOOTSTRAP_REQUIRED: %',array_to_string(missing_roles,',');
            END IF;
            SELECT array_agg(rolname)
              INTO unsafe_roles
              FROM pg_roles
             WHERE rolname IN (
               'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
               'prodx_inventory_admin','prodx_rls_auditor'
             ) AND (rolsuper OR rolbypassrls OR NOT rolcanlogin OR rolinherit OR rolcreatedb OR rolcreaterole OR rolreplication);
            IF unsafe_roles IS NOT NULL THEN
              RAISE EXCEPTION 'STAGING_APP_ROLE_PRIVILEGE_MISMATCH: %',array_to_string(unsafe_roles,',');
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname='prodx_reconciliation_admin'
                 AND rolcanlogin AND NOT rolsuper AND rolbypassrls AND NOT rolinherit
                 AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication
            ) THEN
              RAISE EXCEPTION 'STAGING_RECONCILIATION_ROLE_PRIVILEGE_MISMATCH';
            END IF;
            IF has_table_privilege('prodx_reconciliation_admin','public.sales','INSERT')
               OR has_table_privilege('prodx_reconciliation_admin','public.sales','UPDATE')
               OR has_table_privilege('prodx_reconciliation_admin','public.sales','DELETE')
               OR has_table_privilege('prodx_reconciliation_admin','public.inventory_ledger','INSERT')
               OR has_table_privilege('prodx_reconciliation_admin','public.inventory_ledger','UPDATE')
               OR has_table_privilege('prodx_reconciliation_admin','public.inventory_ledger','DELETE') THEN
              RAISE EXCEPTION 'STAGING_RECONCILIATION_ROLE_MUST_BE_READ_ONLY';
            END IF;
          END $rolepreflight$;
          SQL

      - name: Provision isolated Staging Queues and Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODX_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODX_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.PRODX_STAGING_DATABASE_URL }}
          STAGING_DATABASE_HOST_EXPECTED: ${{ vars.PRODX_STAGING_DATABASE_HOST }}
          STAGING_DATABASE_NAME_EXPECTED: ${{ vars.PRODX_STAGING_DATABASE_NAME }}
          POS_STAGING_ACCESS_AUD: ${{ secrets.PRODX_STAGING_ACCESS_AUD }}
        run: |
          set -euo pipefail
          chmod +x scripts/provision-staging.sh
          ./scripts/provision-staging.sh provision

      - name: Gate 6.0 — Apply Staging migrations, least-privilege grants and RLS smoke
        env:
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.PRODX_STAGING_MIGRATION_DATABASE_URL }}
          STAGING_RLS_AUDIT_DATABASE_URL: ${{ secrets.PRODX_STAGING_RLS_AUDIT_DATABASE_URL }}
        run: |
          set -euo pipefail
          for migration in \
            migrations/001_pos_ledger.sql \
            migrations/002_inventory_nonnegative.sql \
            migrations/003_failed_sequence_recovery.sql \
            migrations/004_terminal_retry_attempt_audit.sql; do
            psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file "$migration" \
              2>&1 | tee "artifacts/logs/$(basename "$migration" .sql).log"
          done
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/grant-runtime-role.sql \
            2>&1 | tee artifacts/logs/grant-runtime-role.log
          # GRANT is additive; fail closed if any pre-existing membership or privilege
          # would widen the dedicated runtime/auditor/reconciliation roles.
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $least_privilege_gate$
          DECLARE violation record;
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_auth_members m
              JOIN pg_roles member_role ON member_role.oid=m.member
              WHERE member_role.rolname IN (
                'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
                'prodx_inventory_admin','prodx_rls_auditor','prodx_reconciliation_admin'
              )
            ) THEN
              RAISE EXCEPTION 'STAGING_RUNTIME_ROLE_MEMBERSHIP_NOT_ALLOWED';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_roles r
              WHERE r.rolname IN (
                'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
                'prodx_inventory_admin','prodx_rls_auditor','prodx_reconciliation_admin'
              ) AND (has_schema_privilege(r.rolname,'public','CREATE')
                     OR has_database_privilege(r.rolname,current_database(),'CREATE'))
            ) THEN
              RAISE EXCEPTION 'STAGING_RUNTIME_ROLE_DDL_PRIVILEGE_NOT_ALLOWED';
            END IF;
            FOR violation IN
              SELECT * FROM (VALUES
                ('prodx_pos_worker','products','INSERT'),('prodx_pos_worker','products','UPDATE'),('prodx_pos_worker','products','DELETE'),('prodx_pos_worker','products','TRUNCATE'),
                ('prodx_pos_worker','tenant_catalog_versions','INSERT'),('prodx_pos_worker','tenant_catalog_versions','UPDATE'),('prodx_pos_worker','tenant_catalog_versions','DELETE'),('prodx_pos_worker','tenant_catalog_versions','TRUNCATE'),
                ('prodx_pos_worker','terminal_devices','INSERT'),('prodx_pos_worker','terminal_devices','UPDATE'),('prodx_pos_worker','terminal_devices','DELETE'),('prodx_pos_worker','terminal_devices','TRUNCATE'),
                ('prodx_pos_worker','sales','UPDATE'),('prodx_pos_worker','sales','DELETE'),('prodx_pos_worker','sales','TRUNCATE'),
                ('prodx_pos_worker','sale_lines','UPDATE'),('prodx_pos_worker','sale_lines','DELETE'),('prodx_pos_worker','sale_lines','TRUNCATE'),
                ('prodx_pos_worker','inventory_ledger','UPDATE'),('prodx_pos_worker','inventory_ledger','DELETE'),('prodx_pos_worker','inventory_ledger','TRUNCATE'),
                ('prodx_pos_worker','audit_logs','UPDATE'),('prodx_pos_worker','audit_logs','DELETE'),('prodx_pos_worker','audit_logs','TRUNCATE'),
                ('prodx_pos_worker','inventory_balances','INSERT'),('prodx_pos_worker','inventory_balances','UPDATE'),
                ('prodx_pos_worker','inventory_balances','DELETE'),('prodx_pos_worker','inventory_balances','TRUNCATE'),
                ('prodx_pos_worker','pos_idempotency','DELETE'),('prodx_pos_worker','pos_idempotency','TRUNCATE'),
                ('prodx_pos_worker','terminal_sync_state','DELETE'),('prodx_pos_worker','terminal_sync_state','TRUNCATE'),
                ('prodx_catalog_writer','products','DELETE'),('prodx_catalog_writer','products','TRUNCATE'),
                ('prodx_catalog_writer','tenant_catalog_versions','DELETE'),('prodx_catalog_writer','tenant_catalog_versions','TRUNCATE'),
                ('prodx_device_admin','terminal_devices','DELETE'),('prodx_device_admin','terminal_devices','TRUNCATE'),
                ('prodx_device_admin','audit_logs','UPDATE'),('prodx_device_admin','audit_logs','DELETE'),('prodx_device_admin','audit_logs','TRUNCATE'),
                ('prodx_inventory_admin','inventory_ledger','UPDATE'),('prodx_inventory_admin','inventory_ledger','DELETE'),('prodx_inventory_admin','inventory_ledger','TRUNCATE'),
                ('prodx_inventory_admin','inventory_balances','INSERT'),('prodx_inventory_admin','inventory_balances','UPDATE'),
                ('prodx_inventory_admin','inventory_balances','DELETE'),('prodx_inventory_admin','inventory_balances','TRUNCATE'),
                ('prodx_inventory_admin','audit_logs','UPDATE'),('prodx_inventory_admin','audit_logs','DELETE'),('prodx_inventory_admin','audit_logs','TRUNCATE'),
                ('prodx_rls_auditor','products','INSERT'),('prodx_rls_auditor','products','UPDATE'),('prodx_rls_auditor','products','DELETE'),('prodx_rls_auditor','products','TRUNCATE'),
                ('prodx_rls_auditor','sales','INSERT'),('prodx_rls_auditor','sales','UPDATE'),('prodx_rls_auditor','sales','DELETE'),('prodx_rls_auditor','sales','TRUNCATE'),
                ('prodx_rls_auditor','sale_lines','INSERT'),('prodx_rls_auditor','sale_lines','UPDATE'),('prodx_rls_auditor','sale_lines','DELETE'),('prodx_rls_auditor','sale_lines','TRUNCATE'),
                ('prodx_rls_auditor','pos_idempotency','INSERT'),('prodx_rls_auditor','pos_idempotency','UPDATE'),('prodx_rls_auditor','pos_idempotency','DELETE'),('prodx_rls_auditor','pos_idempotency','TRUNCATE'),
                ('prodx_rls_auditor','inventory_ledger','INSERT'),('prodx_rls_auditor','inventory_ledger','UPDATE'),('prodx_rls_auditor','inventory_ledger','DELETE'),('prodx_rls_auditor','inventory_ledger','TRUNCATE'),
                ('prodx_rls_auditor','inventory_balances','INSERT'),('prodx_rls_auditor','inventory_balances','UPDATE'),('prodx_rls_auditor','inventory_balances','DELETE'),('prodx_rls_auditor','inventory_balances','TRUNCATE'),
                ('prodx_rls_auditor','audit_logs','INSERT'),('prodx_rls_auditor','audit_logs','UPDATE'),('prodx_rls_auditor','audit_logs','DELETE'),('prodx_rls_auditor','audit_logs','TRUNCATE'),
                ('prodx_rls_auditor','tenant_catalog_versions','INSERT'),('prodx_rls_auditor','tenant_catalog_versions','UPDATE'),('prodx_rls_auditor','tenant_catalog_versions','DELETE'),('prodx_rls_auditor','tenant_catalog_versions','TRUNCATE'),
                ('prodx_rls_auditor','terminal_sync_state','INSERT'),('prodx_rls_auditor','terminal_sync_state','UPDATE'),('prodx_rls_auditor','terminal_sync_state','DELETE'),('prodx_rls_auditor','terminal_sync_state','TRUNCATE'),
                ('prodx_rls_auditor','terminal_devices','INSERT'),('prodx_rls_auditor','terminal_devices','UPDATE'),('prodx_rls_auditor','terminal_devices','DELETE'),('prodx_rls_auditor','terminal_devices','TRUNCATE'),
                ('prodx_reconciliation_admin','products','INSERT'),('prodx_reconciliation_admin','products','UPDATE'),('prodx_reconciliation_admin','products','DELETE'),('prodx_reconciliation_admin','products','TRUNCATE'),
                ('prodx_reconciliation_admin','sales','INSERT'),('prodx_reconciliation_admin','sales','UPDATE'),('prodx_reconciliation_admin','sales','DELETE'),('prodx_reconciliation_admin','sales','TRUNCATE'),
                ('prodx_reconciliation_admin','sale_lines','INSERT'),('prodx_reconciliation_admin','sale_lines','UPDATE'),('prodx_reconciliation_admin','sale_lines','DELETE'),('prodx_reconciliation_admin','sale_lines','TRUNCATE'),
                ('prodx_reconciliation_admin','pos_idempotency','INSERT'),('prodx_reconciliation_admin','pos_idempotency','UPDATE'),('prodx_reconciliation_admin','pos_idempotency','DELETE'),('prodx_reconciliation_admin','pos_idempotency','TRUNCATE'),
                ('prodx_reconciliation_admin','inventory_ledger','INSERT'),('prodx_reconciliation_admin','inventory_ledger','UPDATE'),('prodx_reconciliation_admin','inventory_ledger','DELETE'),('prodx_reconciliation_admin','inventory_ledger','TRUNCATE'),
                ('prodx_reconciliation_admin','inventory_balances','INSERT'),('prodx_reconciliation_admin','inventory_balances','UPDATE'),('prodx_reconciliation_admin','inventory_balances','DELETE'),('prodx_reconciliation_admin','inventory_balances','TRUNCATE'),
                ('prodx_reconciliation_admin','audit_logs','INSERT'),('prodx_reconciliation_admin','audit_logs','UPDATE'),('prodx_reconciliation_admin','audit_logs','DELETE'),('prodx_reconciliation_admin','audit_logs','TRUNCATE'),
                ('prodx_reconciliation_admin','tenant_catalog_versions','INSERT'),('prodx_reconciliation_admin','tenant_catalog_versions','UPDATE'),('prodx_reconciliation_admin','tenant_catalog_versions','DELETE'),('prodx_reconciliation_admin','tenant_catalog_versions','TRUNCATE'),
                ('prodx_reconciliation_admin','terminal_sync_state','INSERT'),('prodx_reconciliation_admin','terminal_sync_state','UPDATE'),('prodx_reconciliation_admin','terminal_sync_state','DELETE'),('prodx_reconciliation_admin','terminal_sync_state','TRUNCATE'),
                ('prodx_reconciliation_admin','terminal_devices','INSERT'),('prodx_reconciliation_admin','terminal_devices','UPDATE'),('prodx_reconciliation_admin','terminal_devices','DELETE'),('prodx_reconciliation_admin','terminal_devices','TRUNCATE')
              ) AS forbidden(role_name,table_name,privilege)
              WHERE has_table_privilege(role_name,format('public.%I',table_name),privilege)
            LOOP
              RAISE EXCEPTION 'STAGING_ROLE_PRIVILEGE_MISMATCH: role %, table %, privilege %',
                violation.role_name,violation.table_name,violation.privilege;
            END LOOP;
          END $least_privilege_gate$;
          SQL
          psql "$STAGING_RLS_AUDIT_DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/rls-smoke.sql \
            2>&1 | tee artifacts/logs/rls-smoke.log

      - name: Generate Staging Wrangler bindings
        run: npx wrangler types

      - name: Deploy Worker to Cloudflare Staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODX_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODX_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Set Staging-only catalog signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODX_STAGING_CLOUDFLARE_API_TOKEN }}
          CATALOG_SIGNING_KEY: ${{ secrets.PRODX_STAGING_CATALOG_SIGNING_KEY }}
        run: ./scripts/provision-staging.sh set-secret

      - name: Gate 6.1 — Vercel Preview proxy to Edge, DO, Queue and PostgreSQL E2E
        env:
          POS_STAGING_SYNC_URL: ${{ secrets.PRODX_STAGING_SYNC_URL }}
          POS_STAGING_PROXY_TOKEN: ${{ secrets.PRODX_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.PRODX_STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_STAGING_E2E_PAYLOAD_B64: ${{ secrets.PRODX_STAGING_E2E_PAYLOAD_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$POS_STAGING_E2E_PAYLOAD_B64" | base64 --decode > /tmp/prodx-staging-e2e.json
          http_code="$(curl --silent --show-error --output /tmp/prodx-staging-accepted.json \
            --write-out '%{http_code}' --request POST \
            --url "${POS_STAGING_SYNC_URL%/}/api/v1/pos/sync-batch" \
            --header "authorization: Bearer $POS_STAGING_PROXY_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --header "x-vercel-set-bypass-cookie: true" \
            --header "content-type: application/json" \
            --data-binary @/tmp/prodx-staging-e2e.json)"
          jq -e 'type == "object" and (.accepted_count | type == "number") and (.has_sequence_gaps | type == "boolean")' \
            /tmp/prodx-staging-accepted.json >/dev/null
          jq '{batch_id,accepted_count,duplicate_count,committed_count,has_sequence_gaps}' /tmp/prodx-staging-accepted.json
          [[ "$http_code" == "202" ]] || { echo "Expected HTTP 202 from Staging proxy, got $http_code"; exit 1; }
          expected="$(jq '.sales | length' /tmp/prodx-staging-e2e.json)"
          accepted="$(jq '.accepted_count' /tmp/prodx-staging-accepted.json)"
          [[ "$accepted" == "$expected" ]] || { echo "Expected $expected newly accepted sales, got $accepted"; exit 1; }
          [[ "$(jq -r '.has_sequence_gaps' /tmp/prodx-staging-accepted.json)" == "false" ]] || {
            echo "Staging E2E batch contains terminal sequence gaps"; exit 1;
          }
          jq -r '.sales[].idempotency_key' /tmp/prodx-staging-e2e.json > /tmp/prodx-staging-keys.txt
          while IFS= read -r key; do
            committed=false
            for attempt in $(seq 1 60); do
              status_code="$(curl --silent --show-error --output /tmp/prodx-staging-status.json \
                --write-out '%{http_code}' --get \
                --url "${POS_STAGING_SYNC_URL%/}/api/v1/pos/receipt-status" \
                --data-urlencode "idempotency_key=$key" \
                --header "authorization: Bearer $POS_STAGING_PROXY_TOKEN" \
                --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                --header "x-vercel-set-bypass-cookie: true")"
              status="$(jq -r '.status // "unknown"' /tmp/prodx-staging-status.json)"
              if [[ "$status_code" == "200" && "$status" == "committed" ]]; then committed=true; break; fi
              if [[ "$status_code" == "409" || "$status" == "failed" || "$status_code" == "400" || "$status_code" == "401" || "$status_code" == "403" || "$status_code" == "404" ]]; then
                echo "Staging sale reached a terminal failure (HTTP $status_code, status=$status)"
                exit 1
              fi
              sleep 5
            done
            [[ "$committed" == "true" ]] || { echo "Timed out waiting for committed receipt"; exit 1; }
          done < /tmp/prodx-staging-keys.txt
          echo "PASS: every E2E sale was committed through the Staging Queue consumer and PostgreSQL."

      - name: Gate 6.2 — Export real Durable Object checkpoint and outbox state through Preview proxy
        env:
          POS_SYNC_URL: ${{ secrets.PRODX_STAGING_SYNC_URL }}
          POS_PROXY_TOKEN: ${{ secrets.PRODX_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.PRODX_STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_TERMINAL_IDS: ${{ secrets.PRODX_STAGING_TERMINAL_IDS_JSON }}
          POS_DO_HEALTH_CSV: do-outbox-export.csv
        run: npm run export:do-health 2>&1 | tee artifacts/logs/export-do-health.log

      - name: Gate 6.3 — Reconcile Edge export against Staging PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.PRODX_STAGING_RECONCILIATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -s do-outbox-export.csv
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/reconcile.sql \
            2>&1 | tee artifacts/logs/staging-reconcile.log
          grep -q 'RECONCILIATION_PASS' artifacts/logs/staging-reconcile.log

      - name: Upload Gate 6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prodx-pos-gate6-staging-evidence
          path: |
            prodx-pos-edge-sync/artifacts/logs/
            prodx-pos-edge-sync/do-outbox-export.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary Staging payloads
        if: always()
        run: |
          set -euo pipefail
          rm -f /tmp/prodx-staging-e2e.json /tmp/prodx-staging-accepted.json
          rm -f /tmp/prodx-staging-status.json /tmp/prodx-staging-keys.txt
