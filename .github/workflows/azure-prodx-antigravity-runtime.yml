name: PRODX - Azure Antigravity Runtime

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: prodx-antigravity-runtime
  cancel-in-progress: false

env:
  AZURE_LOCATION: southeastasia
  VM_NAME: prodx-antigravity
  VM_SIZE: Standard_D4s_v5
  RUNNER_NAME: prodx-antigravity
  RUNNER_LABELS: self-hosted,linux,prodx-antigravity

jobs:
  deploy-runtime:
    name: Provision PRODX Antigravity Runner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az group create \
              --name "${{ secrets.AZURE_RG }}" \
              --location "${{ env.AZURE_LOCATION }}"

      - name: Provision Ubuntu runtime VM
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            if az vm show \
              --resource-group "${{ secrets.AZURE_RG }}" \
              --name "${{ env.VM_NAME }}" \
              >/dev/null 2>&1; then
              echo "VM already exists: ${{ env.VM_NAME }}"
            else
              az vm create \
                --resource-group "${{ secrets.AZURE_RG }}" \
                --name "${{ env.VM_NAME }}" \
                --image Ubuntu2204 \
                --size "${{ env.VM_SIZE }}" \
                --admin-username "${{ secrets.ADMIN_USERNAME }}" \
                --ssh-key-values "${{ secrets.SSH_PUBLIC_KEY }}" \
                --public-ip-address ""
            fi

      - name: Install and register GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            runner_token="$(curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runners/registration-token" \
              | jq -r '.token')"
            test -n "${runner_token}" && test "${runner_token}" != "null"
            echo "::add-mask::${runner_token}"

            cat > /tmp/prodx-runner-bootstrap.sh <<'BOOTSTRAP'
            set -euo pipefail

            id prodxrunner >/dev/null 2>&1 || \
              sudo useradd --create-home --shell /bin/bash prodxrunner

            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ca-certificates curl git jq build-essential python3 python3-pip docker.io
            sudo systemctl enable --now docker
            sudo usermod -aG docker prodxrunner
            sudo install -d -o prodxrunner -g prodxrunner /opt/actions-runner

            if [ ! -f /opt/actions-runner/run.sh ]; then
              arch=$(uname -m)
              case "${arch}" in
                x86_64) runner_arch=x64 ;;
                aarch64) runner_arch=arm64 ;;
                *) echo "Unsupported architecture: ${arch}" >&2; exit 1 ;;
              esac

              version=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
              test -n "${version}" && test "${version}" != "null"
              curl -fsSL \
                -o /tmp/actions-runner.tar.gz \
                "https://github.com/actions/runner/releases/download/v${version}/actions-runner-linux-${runner_arch}-${version}.tar.gz"
              sudo tar -xzf /tmp/actions-runner.tar.gz -C /opt/actions-runner
              sudo chown -R prodxrunner:prodxrunner /opt/actions-runner
              rm -f /tmp/actions-runner.tar.gz
            fi

            sudo -u prodxrunner env HOME=/home/prodxrunner bash -lc '
              cd /opt/actions-runner
              if [ ! -f .runner ]; then
                ./config.sh \
                  --unattended \
                  --url "https://github.com/__REPO__" \
                  --token "__RUNNER_TOKEN__" \
                  --name "prodx-antigravity" \
                  --labels "self-hosted,linux,prodx-antigravity" \
                  --work "_work"
              fi
            '

            if ! systemctl list-unit-files | grep -q 'actions.runner.*.service'; then
              cd /opt/actions-runner
              sudo ./svc.sh install prodxrunner
            fi
            sudo ./svc.sh start
            sudo ./svc.sh status
            rm -f /tmp/prodx-runner-bootstrap.sh
            BOOTSTRAP

            RUNNER_TOKEN="${runner_token}" REPO="${REPO}" python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path("/tmp/prodx-runner-bootstrap.sh")
            content = path.read_text()
            content = content.replace("__RUNNER_TOKEN__", os.environ["RUNNER_TOKEN"])
            content = content.replace("__REPO__", os.environ["REPO"])
            path.write_text(content)
            PY

            az vm run-command invoke \
              --resource-group "${{ secrets.AZURE_RG }}" \
              --name "${{ env.VM_NAME }}" \
              --command-id RunShellScript \
              --scripts "$(cat /tmp/prodx-runner-bootstrap.sh)"
            rm -f /tmp/prodx-runner-bootstrap.sh

      - name: Verify runner registration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runners="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runners")"
          runner="$(jq -c --arg name "${{ env.RUNNER_NAME }}" \
            '[.runners[] | select(.name == $name)] | first // empty' <<<"${runners}")"
          test -n "${runner}"
          jq -e '
            .status == "online" and
            ([.labels[].name] | index("prodx-antigravity") != null)
          ' <<<"${runner}"
          echo "PRODX Azure Antigravity runner is registered and online."
