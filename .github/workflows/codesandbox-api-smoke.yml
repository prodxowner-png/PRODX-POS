name: CodeSandbox API Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/codesandbox-api-smoke.yml"

permissions:
  contents: read

jobs:
  codesandbox-api-smoke:
    name: Verify CodeSandbox API credential
    runs-on: ubuntu-latest
    env:
      CSB_API_KEY: ${{ secrets.CSB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require credential injection without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CSB_API_KEY:-}" ]]; then
            echo "CSB_API_KEY was not injected into the workflow."
            exit 1
          fi
          echo "CSB_API_KEY is injected."

      - name: Install CodeSandbox SDK
        run: npm install --no-save --no-package-lock @codesandbox/sdk@2.4.2

      - name: Authenticate against CodeSandbox API (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { CodeSandbox } from "@codesandbox/sdk";

          const sdk = new CodeSandbox(process.env.CSB_API_KEY);
          const result = await sdk.sandboxes.list({ limit: 1 });

          console.log(JSON.stringify({
            authenticated: true,
            totalCount: result.totalCount,
          }));
          NODE
