name: Owner Console

on:
  pull_request:
    paths:
      - "owner-console/**"
      - ".github/workflows/owner-console.yml"
  push:
    branches: [main]
    paths:
      - "owner-console/**"
      - ".github/workflows/owner-console.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: owner-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
