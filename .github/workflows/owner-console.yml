name: Owner Console

on:
  pull_request:
    paths:
      - "owner-console/**"
      - "supabase/functions/owner-authorize/**"
      - "supabase/config.toml"
      - ".github/workflows/owner-console.yml"
  push:
    branches: [main]
    paths:
      - "owner-console/**"
      - "supabase/functions/owner-authorize/**"
      - "supabase/config.toml"
      - ".github/workflows/owner-console.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-console
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: owner-console/package-lock.json
      - name: Pin npm and verify lifecycle policy
        run: |
          npm install --global npm@11.21.2
          test "$(npm --version)" = "11.21.2"
          test "$(npm config get strict-allow-scripts)" = "true"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - name: Typecheck owner-authorize Edge Function entrypoint
        run: deno check --no-lock ../supabase/functions/owner-authorize/index.ts
      - name: Typecheck owner-authorize Edge Function handler
        run: npx --no-install tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM ../supabase/functions/owner-authorize/handler.ts
      - run: npm test
      - run: npm run build
