name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned release
      with:
        bun-version: 1.4.3

    - name: Install dependencies from lockfile
      run: bun install --frozen-lockfile

    - name: Type check (TypeScript)
      run: bun run lint

    - name: Server TypeScript check
      run: bun run server:check

    - name: Apply PostgreSQL migrations
      shell: bash
      run: |
        set -euo pipefail
        for migration in db/migrations/*.sql; do
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
        done

    - name: Exercise production migration runner on a clean PostgreSQL database
      shell: bash
      run: |
        set -euo pipefail
        PGPASSWORD=prodx createdb --host=127.0.0.1 --username=prodx prodx_migration_runner_test
        DATABASE_URL=postgresql://prodx:prodx@127.0.0.1:5432/prodx_migration_runner_test bun run db:migrate
        psql postgresql://prodx:prodx@127.0.0.1:5432/prodx_migration_runner_test -v ON_ERROR_STOP=1 -Atc "
          SELECT CASE
            WHEN count(*) = 55
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version LIKE '004%') = 6
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version LIKE '005%') = 8
             AND (SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relname IN (
                      'prodx_inventory_ledger_store_created_idx',
                      'prodx_inventory_ledger_store_product_created_idx',
                      'prodx_cash_movements_store_shift_created_idx',
                      'prodx_products_store_category_active_name_idx',
                      'prodx_products_store_lower_sku_active_idx'
                    )
                    AND i.indisvalid) = 5
            THEN 'migration runner verified'
            ELSE 'migration runner verification failed'
          END
          FROM prodx_schema_migrations
        " | grep -Fx 'migration runner verified'

    - name: Run server tests
      run: bun run server:test

    - name: Build application
      run: bun run build

    - name: Verify build artifacts
      run: |
        ls -la dist/
        test -s dist/index.html
        test ! -e dist/index.js
        test ! -e dist/server-bundle.js
        test -s .private-build/server/index.js
        test ! -e build/index.js
        test ! -e build/server-bundle.js
        test ! -e build/diagnostics
        echo "Frontend output verified; server bundle is outside public dist."
        test ! -e dist/stats.html
        test ! -e dist/metafile.json
        test ! -e dist/stats.html.gz
        test ! -e dist/stats.html.br
        test ! -e dist/metafile.json.gz
        test ! -e dist/metafile.json.br
        test ! -e dist/index.js.gz
        test ! -e dist/index.js.br
        test -s .private-build/diagnostics/stats.html
        test -s .private-build/diagnostics/metafile.json
        echo "Server bundle and diagnostics are kept outside public dist output."
