name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js for npm dependency policy
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24.12.0

    - name: Pin npm 11 and verify strict lifecycle policy
      run: |
        npm install --global npm@11.21.2
        test "$(npm --version)" = "11.21.2"
        npm --version
        test "$(npm config get strict-allow-scripts)" = "true"

    - name: Audit locked dependencies (no moderate or higher)
      run: npm audit --audit-level=moderate

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned release
      with:
        bun-version: 1.4.3

    - name: Install dependencies from lockfile
      run: bun install --frozen-lockfile

    - name: Verify dependency override parity across lockfiles
      run: bun run dependency:overrides:check

    - name: Type check (TypeScript)
      run: bun run lint

    - name: Server TypeScript check
      run: bun run server:check

    - name: Verify migration governance
      run: bun run db:migrations:check

    - name: Apply PostgreSQL migrations with production runner
      run: bun run db:migrate

    - name: Exercise production migration runner on a clean PostgreSQL database
      shell: bash
      run: |
        set -euo pipefail
        EXPECTED_MIGRATION_COUNT="$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
        EXPECTED_004_MIGRATION_COUNT="$(find db/migrations -maxdepth 1 -type f -name '004*.sql' | wc -l | tr -d '[:space:]')"
        EXPECTED_005_MIGRATION_COUNT="$(find db/migrations -maxdepth 1 -type f -name '005*.sql' | wc -l | tr -d '[:space:]')"
        EXPECTED_006_MIGRATION_COUNT="$(find db/migrations -maxdepth 1 -type f -name '006*.sql' | wc -l | tr -d '[:space:]')"
        PGPASSWORD=prodx createdb --host=127.0.0.1 --username=prodx prodx_migration_runner_test
        DATABASE_URL=postgresql://prodx:prodx@127.0.0.1:5432/prodx_migration_runner_test bun run db:migrate
        psql postgresql://prodx:prodx@127.0.0.1:5432/prodx_migration_runner_test -v ON_ERROR_STOP=1 -Atc "
          SELECT CASE
            WHEN count(*) = ${EXPECTED_MIGRATION_COUNT}
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version LIKE '004%') = ${EXPECTED_004_MIGRATION_COUNT}
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version LIKE '005%') = ${EXPECTED_005_MIGRATION_COUNT}
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version LIKE '006%') = ${EXPECTED_006_MIGRATION_COUNT}
             AND (SELECT count(*) FROM prodx_schema_migrations WHERE version = '0061_security_revoke_runtime_trigger_function') = 1
             AND (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'public'
                    AND p.proname = 'prodx_seed_discount_policy_for_store'
                    AND NOT has_function_privilege('prodx_app', p.oid, 'EXECUTE')) = 1
             AND NOT has_function_privilege('prodx_app', 'public.prodx_auth_find_supervisor_credential(uuid, uuid, text)', 'EXECUTE')
             AND (SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relname IN (
                      'prodx_inventory_ledger_store_created_idx',
                      'prodx_inventory_ledger_store_product_created_idx',
                      'prodx_cash_movements_store_shift_created_idx',
                      'prodx_products_store_category_active_name_idx',
                      'prodx_products_store_lower_sku_active_idx'
                    )
                    AND i.indisvalid) = 5
            THEN 'migration runner verified'
            ELSE 'migration runner verification failed'
          END
          FROM prodx_schema_migrations
        " | grep -Fx 'migration runner verified'

    - name: Run client tests
      run: bun run client:test

    - name: Prepare isolated first-tenant PostgreSQL integration database
      shell: bash
      run: |
        set -euo pipefail
        PGPASSWORD=prodx createdb --host=127.0.0.1 --username=prodx prodx_bootstrap_test
        DATABASE_URL=postgresql://prodx:prodx@127.0.0.1:5432/prodx_bootstrap_test bun run db:migrate

    - name: Run server tests including first-tenant PostgreSQL integration (no skips)
      shell: bash
      env:
        PRODX_RUN_BOOTSTRAP_POSTGRES_INTEGRATION: '1'
        PRODX_BOOTSTRAP_TEST_DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_bootstrap_test
      run: |
        set -euo pipefail
        bun run server:test 2>&1 | tee /tmp/prodx-server-test.log
        grep -Eq '^ℹ skipped 0$' /tmp/prodx-server-test.log

    - name: Build application
      run: bun run build

    - name: Verify build artifacts
      run: |
        ls -la dist/
        test -s dist/index.html
        test ! -e dist/index.js
        test ! -e dist/server-bundle.js
        test -s .private-build/server/index.js
        test ! -e build/index.js
        test ! -e build/server-bundle.js
        test ! -e build/diagnostics
        echo "Frontend output verified; server bundle is outside public dist."
        test ! -e dist/stats.html
        test ! -e dist/metafile.json
        test ! -e dist/stats.html.gz
        test ! -e dist/stats.html.br
        test ! -e dist/metafile.json.gz
        test ! -e dist/metafile.json.br
        test ! -e dist/index.js.gz
        test ! -e dist/index.js.br
        test -s .private-build/diagnostics/stats.html
        test -s .private-build/diagnostics/metafile.json
        echo "Server bundle and diagnostics are kept outside public dist output."
