name: Gemini Model Router Contract Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/gemini_model_router.py"
      - "scripts/gemini_pr_review_routed.py"
      - "scripts/test_gemini_model_router.py"
      - ".github/workflows/gemini-model-router-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: gemini-model-router-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run model router tests
        run: python3 -m unittest discover -s scripts -p 'test_gemini_model_router.py' -v
