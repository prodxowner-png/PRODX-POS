name: PRODX POS — Gate 6 Cloudflare Staging Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prodx-pos-gate6-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Provision, Deploy & Verify Cloudflare Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        shell: bash
        working-directory: prodx-pos-edge-sync
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prodx-pos-edge-sync/package-lock.json

      - name: Preflight — require isolated Staging credentials and E2E fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STAGING_RLS_AUDIT_DATABASE_URL: ${{ secrets.STAGING_RLS_AUDIT_DATABASE_URL }}
          STAGING_RECONCILIATION_DATABASE_URL: ${{ secrets.STAGING_RECONCILIATION_DATABASE_URL }}
          POS_STAGING_ACCESS_AUD: ${{ secrets.POS_STAGING_ACCESS_AUD }}
          POS_STAGING_SYNC_URL: ${{ secrets.POS_STAGING_SYNC_URL }}
          POS_STAGING_PROXY_TOKEN: ${{ secrets.POS_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_STAGING_E2E_PAYLOAD_B64: ${{ secrets.POS_STAGING_E2E_PAYLOAD_B64 }}
          POS_STAGING_TERMINAL_IDS_JSON: ${{ secrets.POS_STAGING_TERMINAL_IDS_JSON }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          EXPECTED_STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          EXPECTED_STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST: ${{ vars.STAGING_RECONCILIATION_DATABASE_HOST }}
          EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME: ${{ vars.STAGING_RECONCILIATION_DATABASE_NAME }}
          EXPECTED_POS_STAGING_SYNC_HOST: ${{ vars.POS_STAGING_SYNC_HOST }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL
            STAGING_MIGRATION_DATABASE_URL STAGING_RLS_AUDIT_DATABASE_URL
            STAGING_RECONCILIATION_DATABASE_URL POS_STAGING_ACCESS_AUD POS_STAGING_SYNC_URL
            POS_STAGING_PROXY_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET POS_STAGING_E2E_PAYLOAD_B64
            POS_STAGING_TERMINAL_IDS_JSON CATALOG_SIGNING_KEY
            EXPECTED_STAGING_DATABASE_HOST EXPECTED_STAGING_DATABASE_NAME
            EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST
            EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME EXPECTED_POS_STAGING_SYNC_HOST)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment 'staging' secret: $name"
              exit 1
            fi
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          function validateDatabaseUrl(raw, expectedHost, expectedDatabase, label) {
            const url = new URL(raw);
            assert.ok(['postgres:', 'postgresql:'].includes(url.protocol), label + ' must use PostgreSQL');
            assert.equal(url.hostname.toLowerCase(), expectedHost.toLowerCase(), label + ' host is not the approved Staging host');
            assert.equal(decodeURIComponent(url.pathname.slice(1)), expectedDatabase, label + ' database is not the approved Staging database');
          }
          const syncUrl = new URL(process.env.POS_STAGING_SYNC_URL);
          assert.equal(syncUrl.protocol, 'https:', 'Staging sync endpoint must use HTTPS');
          assert.equal(syncUrl.username, '', 'Staging sync URL must not embed credentials');
          assert.equal(syncUrl.password, '', 'Staging sync URL must not embed credentials');
          assert.equal(syncUrl.search, '', 'Staging sync URL must not contain query parameters');
          assert.equal(syncUrl.hash, '', 'Staging sync URL must not contain a fragment');
          assert.ok(syncUrl.hostname.toLowerCase().endsWith('.vercel.app'),
            'Gate 6 must use a Vercel Preview hostname');
          assert.equal(syncUrl.hostname.toLowerCase(), process.env.EXPECTED_POS_STAGING_SYNC_HOST.toLowerCase(),
            'Staging sync hostname is not the approved Vercel Preview hostname');
          assert.equal(syncUrl.pathname.replace(/\/$/, ''), '/__staging/edge',
            'Staging sync URL must target the dedicated Vercel Preview proxy path');
          assert.notEqual(syncUrl.hostname.toLowerCase(), 'prodx-pos.vercel.app',
            'Production alias must never be used for Gate 6 Staging');
          validateDatabaseUrl(process.env.STAGING_DATABASE_URL,
            process.env.EXPECTED_STAGING_DATABASE_HOST, process.env.EXPECTED_STAGING_DATABASE_NAME,
            'STAGING_DATABASE_URL');
          validateDatabaseUrl(process.env.STAGING_MIGRATION_DATABASE_URL,
            process.env.EXPECTED_STAGING_DATABASE_HOST, process.env.EXPECTED_STAGING_DATABASE_NAME,
            'STAGING_MIGRATION_DATABASE_URL');
          validateDatabaseUrl(process.env.STAGING_RLS_AUDIT_DATABASE_URL,
            process.env.EXPECTED_STAGING_DATABASE_HOST, process.env.EXPECTED_STAGING_DATABASE_NAME,
            'STAGING_RLS_AUDIT_DATABASE_URL');
          const workerDb = new URL(process.env.STAGING_DATABASE_URL);
          const migrationDb = new URL(process.env.STAGING_MIGRATION_DATABASE_URL);
          const rlsAuditDb = new URL(process.env.STAGING_RLS_AUDIT_DATABASE_URL);
          const reconciliationDb = new URL(process.env.STAGING_RECONCILIATION_DATABASE_URL);
          assert.equal(decodeURIComponent(workerDb.username), 'prodx_pos_worker',
            'Hyperdrive must use the least-privilege prodx_pos_worker role');
          assert.equal(decodeURIComponent(rlsAuditDb.username), 'prodx_rls_auditor',
            'RLS smoke must use the NOBYPASSRLS prodx_rls_auditor role');
          assert.equal(decodeURIComponent(reconciliationDb.username), 'prodx_reconciliation_admin',
            'Reconciliation must use the isolated read-only reconciliation role');
          assert.ok(!['prodx_pos_worker','prodx_rls_auditor','prodx_reconciliation_admin']
            .includes(decodeURIComponent(migrationDb.username)),
            'Migration URL must use a separate DDL-capable staging migration role');
          validateDatabaseUrl(process.env.STAGING_RECONCILIATION_DATABASE_URL,
            process.env.EXPECTED_STAGING_RECONCILIATION_DATABASE_HOST,
            process.env.EXPECTED_STAGING_RECONCILIATION_DATABASE_NAME,
            'STAGING_RECONCILIATION_DATABASE_URL');
          console.log('Both PostgreSQL URLs and the sync endpoint match exact Staging allowlists.');
          NODE
          node -e 'const p=JSON.parse(Buffer.from(process.env.POS_STAGING_E2E_PAYLOAD_B64,"base64").toString("utf8")); if(!p || !Array.isArray(p.sales) || p.sales.length<10 || p.sales.length>50) process.exit(1); console.log("E2E fixture shape valid:",p.sales.length,"sales")'
          node -e 'const ids=JSON.parse(process.env.POS_STAGING_TERMINAL_IDS_JSON); if(!Array.isArray(ids)||!ids.length||ids.some(x=>typeof x!=="string")) process.exit(1); console.log("DO health terminal IDs valid:",ids.length)'
          mkdir -p artifacts/logs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Preflight — verify Staging database roles before provisioning
        env:
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $rolepreflight$
          DECLARE missing_roles text[]; unsafe_roles text[];
          BEGIN
            SELECT array_agg(required.rolename)
              INTO missing_roles
              FROM unnest(ARRAY[
                'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
                'prodx_inventory_admin','prodx_rls_auditor','prodx_reconciliation_admin'
              ]) AS required(rolename)
             WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=required.rolename);
            IF missing_roles IS NOT NULL THEN
              RAISE EXCEPTION 'STAGING_ROLE_BOOTSTRAP_REQUIRED: %',array_to_string(missing_roles,',');
            END IF;
            SELECT array_agg(rolname)
              INTO unsafe_roles
              FROM pg_roles
             WHERE rolname IN (
               'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
               'prodx_inventory_admin','prodx_rls_auditor'
             ) AND (rolsuper OR rolbypassrls OR NOT rolcanlogin);
            IF unsafe_roles IS NOT NULL THEN
              RAISE EXCEPTION 'STAGING_APP_ROLE_PRIVILEGE_MISMATCH: %',array_to_string(unsafe_roles,',');
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname='prodx_reconciliation_admin'
                 AND rolcanlogin AND NOT rolsuper AND rolbypassrls
            ) THEN
              RAISE EXCEPTION 'STAGING_RECONCILIATION_ROLE_PRIVILEGE_MISMATCH';
            END IF;
          END $rolepreflight$;
          SQL

      - name: Provision isolated Staging Queues and Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_HOST_EXPECTED: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_DATABASE_NAME_EXPECTED: ${{ vars.STAGING_DATABASE_NAME }}
          POS_STAGING_ACCESS_AUD: ${{ secrets.POS_STAGING_ACCESS_AUD }}
        run: |
          chmod +x scripts/provision-staging.sh
          ./scripts/provision-staging.sh provision

      - name: Gate 6.0 — Apply Staging migrations and least-privilege grants
        env:
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STAGING_RLS_AUDIT_DATABASE_URL: ${{ secrets.STAGING_RLS_AUDIT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Fail closed if the six separately provisioned non-owner roles are absent.
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $rolecheck$
          DECLARE missing_roles text[];
          BEGIN
            SELECT array_agg(required.rolename)
              INTO missing_roles
              FROM unnest(ARRAY[
                'prodx_pos_worker','prodx_catalog_writer','prodx_device_admin',
                'prodx_inventory_admin','prodx_rls_auditor','prodx_reconciliation_admin'
              ]) AS required(rolename)
             WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=required.rolename);
            IF missing_roles IS NOT NULL THEN
              RAISE EXCEPTION 'STAGING_ROLE_BOOTSTRAP_REQUIRED: %',array_to_string(missing_roles,',');
            END IF;
          END $rolecheck$;
          SQL
          for migration in \
            migrations/001_pos_ledger.sql \
            migrations/002_inventory_nonnegative.sql \
            migrations/003_failed_sequence_recovery.sql \
            migrations/004_terminal_retry_attempt_audit.sql; do
            psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file "$migration"
          done
          psql "$STAGING_MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/grant-runtime-role.sql
          psql "$STAGING_RLS_AUDIT_DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/rls-smoke.sql

      - name: Generate Staging Wrangler bindings
        run: npx wrangler types

      - name: Deploy Worker to Cloudflare Staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Set Staging-only catalog signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: ./scripts/provision-staging.sh set-secret

      - name: Gate 6.1 — Edge to DO to Queue to Hyperdrive E2E
        env:
          POS_STAGING_SYNC_URL: ${{ secrets.POS_STAGING_SYNC_URL }}
          POS_STAGING_PROXY_TOKEN: ${{ secrets.POS_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_STAGING_E2E_PAYLOAD_B64: ${{ secrets.POS_STAGING_E2E_PAYLOAD_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$POS_STAGING_E2E_PAYLOAD_B64" | base64 --decode > /tmp/prodx-staging-e2e.json
          http_code="$(curl --silent --show-error --output /tmp/prodx-staging-accepted.json \
            --write-out '%{http_code}' --request POST \
            --url "${POS_STAGING_SYNC_URL%/}/api/v1/pos/sync-batch" \
            --header "authorization: Bearer $POS_STAGING_PROXY_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --header "x-vercel-set-bypass-cookie: true" \
            --header "content-type: application/json" \
            --data-binary @/tmp/prodx-staging-e2e.json)"
          cat /tmp/prodx-staging-accepted.json | jq '{batch_id,accepted_count,duplicate_count,committed_count,has_sequence_gaps}'
          [[ "$http_code" == "202" ]] || { echo "Expected HTTP 202 from Edge, got $http_code"; exit 1; }
          expected="$(jq '.sales | length' /tmp/prodx-staging-e2e.json)"
          accepted="$(jq '.accepted_count' /tmp/prodx-staging-accepted.json)"
          [[ "$accepted" == "$expected" ]] || { echo "Expected $expected newly accepted sales, got $accepted"; exit 1; }
          [[ "$(jq -r '.has_sequence_gaps' /tmp/prodx-staging-accepted.json)" == "false" ]] || {
            echo "Staging E2E batch contains terminal sequence gaps"; exit 1;
          }

          jq -r '.sales[].idempotency_key' /tmp/prodx-staging-e2e.json > /tmp/prodx-staging-keys.txt
          while IFS= read -r key; do
            committed=false
            for attempt in $(seq 1 60); do
              status_code="$(curl --silent --show-error --output /tmp/prodx-staging-status.json \
                --write-out '%{http_code}' --request GET \
                --url "${POS_STAGING_SYNC_URL%/}/api/v1/pos/receipt-status?idempotency_key=$key" \
                --header "authorization: Bearer $POS_STAGING_PROXY_TOKEN" \
                --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                --header "x-vercel-set-bypass-cookie: true")"
              status="$(jq -r '.status // "unknown"' /tmp/prodx-staging-status.json)"
              if [[ "$status_code" == "200" && "$status" == "committed" ]]; then committed=true; break; fi
              if [[ "$status_code" == "409" || "$status" == "failed" ]]; then
                cat /tmp/prodx-staging-status.json
                echo "Staging sale reached FAILED state"; exit 1
              fi
              sleep 5
            done
            [[ "$committed" == "true" ]] || { echo "Timed out waiting for committed receipt"; exit 1; }
          done < /tmp/prodx-staging-keys.txt
          echo "PASS: every E2E sale was committed through the Staging Queue consumer and PostgreSQL."

      - name: Gate 6.2 — Export real Durable Object checkpoint and outbox state
        env:
          POS_SYNC_URL: ${{ secrets.POS_STAGING_SYNC_URL }}
          POS_PROXY_TOKEN: ${{ secrets.POS_STAGING_PROXY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          POS_TERMINAL_IDS: ${{ secrets.POS_STAGING_TERMINAL_IDS_JSON }}
          POS_DO_HEALTH_CSV: do-outbox-export.csv
        run: npm run export:do-health 2>&1 | tee artifacts/logs/export-do-health.log

      - name: Gate 6.3 — Reconcile Cloudflare DO export against Staging PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.STAGING_RECONCILIATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -s do-outbox-export.csv
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file scripts/reconcile.sql \
            2>&1 | tee artifacts/logs/staging-reconcile.log
          grep -q 'RECONCILIATION_PASS' artifacts/logs/staging-reconcile.log

      - name: Upload Gate 6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prodx-pos-gate6-staging-evidence
          path: |
            prodx-pos-edge-sync/artifacts/logs/
            prodx-pos-edge-sync/do-outbox-export.csv
            /tmp/prodx-staging-accepted.json
            /tmp/prodx-staging-status.json
          if-no-files-found: warn
          retention-days: 14
