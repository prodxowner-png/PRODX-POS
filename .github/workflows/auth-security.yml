name: Auth Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: M2 PostgreSQL authentication integration
        run: npm run server:test:integration

      - name: First-tenant bootstrap PostgreSQL integration
        env:
          PRODX_RUN_BOOTSTRAP_POSTGRES_INTEGRATION: '1'
          PRODX_BOOTSTRAP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: node --import tsx --test server/auth/first-tenant-bootstrap.integration.test.ts

      - name: Reject direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
            "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext. Use authApiFactory instead."
            exit 1
          fi

      - name: Reject hardcoded default admin credential paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            'DEFAULT_SYSTEM_OWNER_PASSWORD|DEFAULT_STAFF_PASSWORDS|initializeDefaultAdminCredentials|resetAdminPasswordToDefault|default_hardcoded' src; then
            echo "Hardcoded default administrator credential path detected."
            exit 1
          fi

      - name: Reject universal demo unlock credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            "(trimmed|pinOrPassword)[^\n]*(===|!==)[[:space:]]*['\"](1234|0000|5678|1111|admin)['\"]|DEFAULT_STAFF_PINS|defaultPin|Quick Demo|Demo bypass|any 6 digits|โหมดทดสอบ" src; then
            echo "Universal demo unlock credential detected in source."
            exit 1
          fi
