name: Gemini AI advisory review (non-gating)

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

concurrency:
  group: gemini-ai-review-global
  cancel-in-progress: false

jobs:
  review:
    name: Gemini advisory code, architecture & security review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run isolated diff-only review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/gemini_pr_review.py

      - name: Verify review contract tests
        if: always()
        run: python3 -m unittest discover -s scripts -p 'test_gemini_pr_review.py' -v
