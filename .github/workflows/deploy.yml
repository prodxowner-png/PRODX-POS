name: Production Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # pinned release
        with:
          bun-version: 1.4.3

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Type check frontend
        run: bun run lint

      - name: Type check backend
        run: bun run server:check

      - name: Run server tests
        run: bun run server:test

      - name: Build production application
        run: bun run build

      - name: Validate theme
        run: bun run theme:validate

      - name: Verify build artifacts and keep diagnostics private
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test ! -e dist/index.js
          test ! -e dist/server-bundle.js
          test -s .private-build/server/index.js
          test ! -e build/index.js
          test ! -e build/server-bundle.js
          test ! -e build/diagnostics
          test ! -e dist/metafile.json
          test ! -e dist/stats.html
          test ! -e dist/metafile.json.gz
          test ! -e dist/metafile.json.br
          test ! -e dist/stats.html.gz
          test ! -e dist/stats.html.br
          test ! -e dist/index.js.gz
          test ! -e dist/index.js.br
          test -s .private-build/diagnostics/metafile.json
          test -s .private-build/diagnostics/stats.html
          echo "Public output verified; server bundle and diagnostics are outside dist."

      - name: Upload private bundle analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prodx-build-analysis
          path: |
            .private-build/diagnostics/stats.html
            .private-build/diagnostics/metafile.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
