name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, backend, PostgreSQL, build & security validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx
          POSTGRES_DB: prodx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://prodx:prodx@127.0.0.1:5432/prodx_test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Type check frontend
        run: bun run lint

      - name: Type check backend
        run: bun run server:check

      - name: Prepare PostgreSQL schema for backend integration tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          migrations=(db/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Backend boundary tests
        run: bun run server:test

      - name: Refund HTTP boundary and PostgreSQL invariant tests
        run: bun run server:test:refund

      - name: PostgreSQL foundation and migration gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT version();'
          migrations=(db/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0001_m0_foundation';
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0002_m1_organization_store_foundation';
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0003_m1_1_auth_identity';
          SELECT 1 FROM prodx_schema_migrations WHERE version = '0004_m1_2_rbac';
          SELECT 1 FROM prodx_migration_lock WHERE lock_id = 1;
          SELECT current_setting('TimeZone') AS session_timezone;
          SELECT (TIMESTAMPTZ '2026-01-01 00:00:00+00' AT TIME ZONE 'UTC') = TIMESTAMP '2026-01-01 00:00:00';
          SELECT (CAST(1234.56 AS NUMERIC(12,2)) = 1234.56);
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_stores_org_code_unique';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_stores_timezone_not_blank';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_users_org_username_unique';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_user_credentials_hash_not_blank';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_roles_id_organization_unique';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_store_memberships_store_org_fk';
          SELECT conname FROM pg_constraint WHERE conname = 'prodx_user_roles_store_membership_fk';
          SELECT count(*) = 15 FROM prodx_permissions;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO prodx_organizations (id, code, name)
          VALUES
            ('00000000-0000-0000-0000-000000000001', 'ci-org', 'CI Organization'),
            ('00000000-0000-0000-0000-000000000002', 'ci-org-2', 'CI Organization 2');
          INSERT INTO prodx_stores (id, organization_id, code, name, business_timezone)
          VALUES
            ('00000000-0000-0000-0000-000000000021', '00000000-0000-0000-0000-000000000001', 'ci-store', 'CI Store', 'Asia/Bangkok'),
            ('00000000-0000-0000-0000-000000000022', '00000000-0000-0000-0000-000000000002', 'ci-store-2', 'CI Store 2', 'Asia/Bangkok');
          INSERT INTO prodx_users (id, organization_id, username, display_name)
          VALUES
            ('00000000-0000-0000-0000-000000000011', '00000000-0000-0000-0000-000000000001', 'ci-user', 'CI User'),
            ('00000000-0000-0000-0000-000000000012', '00000000-0000-0000-0000-000000000002', 'ci-user-2', 'CI User 2');
          INSERT INTO prodx_user_credentials (user_id, credential_type, secret_hash)
          VALUES ('00000000-0000-0000-0000-000000000011', 'password', 'test-hash');
          INSERT INTO prodx_roles (id, organization_id, role_key, name)
          VALUES
            ('00000000-0000-0000-0000-000000000031', '00000000-0000-0000-0000-000000000001', 'cashier', 'Cashier'),
            ('00000000-0000-0000-0000-000000000032', '00000000-0000-0000-0000-000000000002', 'cashier', 'Cashier');
          INSERT INTO prodx_store_memberships (organization_id, store_id, user_id)
          VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000021', '00000000-0000-0000-0000-000000000011');
          INSERT INTO prodx_user_roles (organization_id, user_id, role_id, store_id)
          VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000011', '00000000-0000-0000-0000-000000000031', '00000000-0000-0000-0000-000000000021');
          INSERT INTO prodx_role_permissions (organization_id, role_id, permission_id)
          VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000031', '10000000-0000-4000-8000-000000000006');
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            BEGIN
              INSERT INTO prodx_users (id, organization_id, username, display_name)
              VALUES ('00000000-0000-0000-0000-000000000013', '00000000-0000-0000-0000-000000000001', 'ci-user', 'Duplicate User');
              RAISE EXCEPTION 'expected organization username uniqueness violation';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO prodx_user_credentials (user_id, credential_type, secret_hash)
              VALUES ('00000000-0000-0000-0000-000000000011', 'password', '');
              RAISE EXCEPTION 'expected credential hash constraint violation';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO prodx_store_memberships (organization_id, store_id, user_id)
              VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000022', '00000000-0000-0000-0000-000000000011');
              RAISE EXCEPTION 'expected store organization isolation violation';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO prodx_user_roles (organization_id, user_id, role_id, store_id)
              VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000011', '00000000-0000-0000-0000-000000000032', '00000000-0000-0000-0000-000000000021');
              RAISE EXCEPTION 'expected role organization isolation violation';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;
          END $$;
          SQL
          before=$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM prodx_schema_migrations WHERE version IN ('0001_m0_foundation', '0002_m1_organization_store_foundation', '0003_m1_1_auth_identity', '0004_m1_2_rbac');")
          for migration in "${migrations[@]}"; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          after=$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM prodx_schema_migrations WHERE version IN ('0001_m0_foundation', '0002_m1_organization_store_foundation', '0003_m1_1_auth_identity', '0004_m1_2_rbac');")
          test "$before" = "$after"
          test "$after" = "4"

      - name: Theme validation
        run: bun run theme:validate

      - name: Production build
        run: bun run build

      - name: Verify no universal demo unlock credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            "(trimmed|pinOrPassword)[^\n]*(===|!==)[[:space:]]*['\"](1234|0000|5678|1111|admin)['\"]|DEFAULT_STAFF_PINS" src; then
            echo "Universal demo unlock credential detected in source."
            exit 1
          fi

      - name: Verify no direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext."
            exit 1
          fi


      - name: Verify offline sync context does not directly import mock sync adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -n "syncApi.*mockAdapter" src/context/OfflineContext.tsx; then
            echo "Direct mock sync adapter import detected in production offline context."
            exit 1
          fi
      - name: Verify POS checkout does not directly import mock transaction adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
            "from '../../adapters/mockAdapter'" \
            src/modules/pos/PaymentConfirmationModal.tsx \
            src/modules/pos/QuickPayDrawer.tsx; then
            echo "Direct mock order adapter import detected in production checkout UI."
            exit 1
          fi

      - name: Verify shift production boundary has no direct mock adapter wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' "from '../adapters/mockAdapter'" src/context/ShiftContext.tsx; then
            echo "Direct mock shift adapter import detected in production ShiftContext."
            exit 1
          fi
          if grep -n "from '../../adapters/mockAdapter'" src/modules/shift/ClockInOutModal.tsx; then
            echo "Direct mock shift adapter import detected in production timeclock UI."
            exit 1
          fi
          if grep -R -n -E --include='*.ts' --include='*.tsx' "Demo: 1234|1234 \(Admin\)|5678 \(Manager\)|0000 \(Cashier\)" src/modules/shift; then
            echo "Demo timeclock credentials detected in production shift UI."
            exit 1
          fi

      - name: Verify POS refund does not directly import mock transaction adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -n "from '../../adapters/mockAdapter'" src/components/orders/OrderRefundModal.tsx; then
            echo "Direct mock refund adapter import detected in production refund UI."
            exit 1
          fi
